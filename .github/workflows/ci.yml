name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: kernel must stay dependency-free
        run: node -e "const p=require('./packages/kernel/package.json');const d=p.dependencies||{};if(Object.keys(d).length){console.error('kernel 不能有运行时依赖:',d);process.exit(1)}"
      - run: pnpm smoke
