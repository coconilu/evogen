name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the release pipeline explicitly dispatches CI on the merge commit
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: kernel must stay dependency-free
        run: pnpm check:kernel
      - run: pnpm test
      - name: release orchestration tests
        run: pnpm test:release
      - run: pnpm smoke

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! reads the built frontend at compile time
      - run: pnpm --filter @evogen/desktop build
      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
